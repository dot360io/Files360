name: Feature request
description: Suggest something Files360 should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Some features are out of scope for good. Please check the "Never" list in PLAN.md before writing this up.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like it to work, from the operator's or the API client's side.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I have read the "Never" list in PLAN.md, and this request is not on it.
          required: true
